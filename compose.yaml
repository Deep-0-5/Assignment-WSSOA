services:
  # ============================================================================
  # 1. API GATEWAY (SINGLE PUBLIC ENTRY POINT)
  # Only this service exposes a host port externally.
  # Handles routing, logging, health checks, and 502/503 error handling.
  # ============================================================================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - campus-network
    restart: on-failure

  # ============================================================================
  # 2. USER MICROSERVICE
  # Internal only: reachable via Docker network at http://user-service:3001
  # No external host port exposed!
  # ============================================================================
  user-service:
    build: ./user-service
    container_name: user-service
    expose:
      - "3001"
    environment:
      PORT: 3001
      MONGODB_URI: ${USER_MONGODB_URI:-mongodb://user-db:27017/userdb}
    depends_on:
      - user-db
    networks:
      - campus-network
    restart: on-failure

  user-db:
    image: mongo:latest
    container_name: user-db
    expose:
      - "27017"
    volumes:
      - user-mongo-data:/data/db
    networks:
      - campus-network
    restart: unless-stopped

  # ============================================================================
  # 3. PRODUCT MICROSERVICE
  # Internal only: reachable via Docker network at http://product-service:3002
  # No external host port exposed!
  # ============================================================================
  product-service:
    build: ./product-service
    container_name: product-service
    expose:
      - "3002"
    environment:
      PORT: 3002
      MONGODB_URI: ${PRODUCT_MONGODB_URI:-mongodb://product-db:27017/productdb}
    depends_on:
      - product-db
    networks:
      - campus-network
    restart: on-failure

  product-db:
    image: mongo:latest
    container_name: product-db
    expose:
      - "27017"
    volumes:
      - product-mongo-data:/data/db
    networks:
      - campus-network
    restart: unless-stopped

  # ============================================================================
  # 4. ORDER MICROSERVICE
  # Internal only: reachable via Docker network at http://order-service:3003
  # Inter-service calls directly to user-service and product-service over network
  # No external host port exposed!
  # ============================================================================
  order-service:
    build: ./order-service
    container_name: order-service
    expose:
      - "3003"
    environment:
      PORT: 3003
      MONGODB_URI: ${ORDER_MONGODB_URI:-mongodb://order-db:27017/orderdb}
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      - order-db
      - user-service
      - product-service
    networks:
      - campus-network
    restart: on-failure

  order-db:
    image: mongo:latest
    container_name: order-db
    expose:
      - "27017"
    volumes:
      - order-mongo-data:/data/db
    networks:
      - campus-network
    restart: unless-stopped

# ============================================================================
# SHARED INTERNAL DOCKER NETWORK
# ============================================================================
networks:
  campus-network:
    name: campus-network
    driver: bridge

# ============================================================================
# PERSISTENT VOLUMES (Database-per-Service)
# ============================================================================
volumes:
  user-mongo-data:
    driver: local
  product-mongo-data:
    driver: local
  order-mongo-data:
    driver: local
